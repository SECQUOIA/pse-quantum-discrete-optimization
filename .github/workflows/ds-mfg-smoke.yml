name: DS-MFG Smoke Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: Fresh clone smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: case-studies/ds-mfg-qubo-qiskitopt

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Run reproducibility bootstrap
        run: scripts/bootstrap_ds_mfg.sh
